<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Loteria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Gerador de Números para Loteria</h1>
    <hr>

    <section>
        <h2>Mega-Sena</h2>
        <p>Sorteia 6 números de 1 a 60</p>
        <button id="btn-mega">Gerar Números da Mega</button>
        <div id="resultado-mega" class="resultado">Clique no botão para sortear</div>
    </section>
    <hr>

    <section>
        <h2>Quina</h2>
        <p>Sorteia 5 números de 1 a 80</p>
        <button id="btn-quina">Sortear Números da Quina</button>
        <div id="resultado-quina" class="resultado">Clique no botão para sortear</div>
    </section> 

    <...>

    <section>
        <h2>Lotofácil</h2>
        <p>Sorteia 15 números de 1 a 25</p>
        <button id="btn-lotofacil">Gerar Números da Lotofácil</button>
        <div id="resultado-lotofacil" class="resultado">Clique no botão para sortear</div>
    </section>

    <script src="script.js"></script>
</body>
</html>
